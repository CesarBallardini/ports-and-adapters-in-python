name: pytest

on:
  push:
    branches: [main, master]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Default run: SQLite, nothing to install. This is the suite a reader gets
  # locally with `make test` (ADR-0007).
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python

      # --cov-config makes the .coveragerc gate explicit rather than relying on
      # coverage's file discovery; fail_under in that file is what turns a
      # coverage drop into a failed build.
      - name: Run tests with coverage
        run: >-
          uv run --frozen pytest -n auto
          --cov=academy
          --cov-config=.coveragerc
          --cov-report=xml
          --cov-report=term-missing

  # The same integration and persistence suites, against the database this
  # application actually targets. SQLite is permissive about types, lenient
  # about constraints and different about transaction semantics, so an adapter
  # only ever exercised against it is an untested adapter (ADR-0007).
  pytest-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        # Pinned to a major version, not to a digest: the point is to run against the
        # database this application targets, and a patch release of it is exactly what we
        # want picked up. Bump the major deliberately -- it is the one thing here that can
        # change transaction or type behaviour under an adapter (ADR-0007).
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: academy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ACADEMY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/academy_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python

      - name: Run the integration tier against PostgreSQL
        run: uv run --frozen pytest -m integration

  # The e2e tier, which the default job excludes by marker. Its own job because it spawns
  # interpreters -- `python -m academy` in a real subprocess -- and is therefore slow and
  # differently fragile from everything else. It is the only tier that can catch an entry point
  # that does not resolve, or an exit status that never reaches a shell.
  pytest-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python

      # The browser tier skips itself when Chromium is missing, which makes this step the
      # thing that stops it skipping silently forever. `--with-deps` pulls the shared
      # libraries a headless Chromium needs on a bare runner; only Chromium is installed,
      # because only Chromium is used.
      - name: Install the browser the e2e tier drives
        run: uv run --frozen playwright install --with-deps chromium

      # No ALLOW_EMPTY_TIER equivalent here either: pytest exits 5 when a marker selects
      # nothing, and now that this tier has tests that is a failure worth reporting.
      - name: Run the e2e tier
        run: uv run --frozen pytest -m e2e
