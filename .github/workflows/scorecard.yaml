name: scorecard

# OpenSSF Scorecard grades this repository's supply-chain posture -- pinned
# action digests, least-privilege workflow tokens, branch protection, a
# security policy, dependency update automation. Most of what it measures is
# already in place; this workflow is what turns that into a published score
# and a code-scanning alert when it regresses.

on:
  # Branch-Protection is only checkable on the default branch.
  branch_protection_rule:
  schedule:
    - cron: "25 15 * * 2"
  push:
    branches: [main, master]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # publish_results only works from the default branch.
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      # Upload the SARIF results to the code-scanning dashboard.
      security-events: write
      # Publish results to the OpenSSF API so the README badge resolves.
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing is what allows the badge; it requires a public repo.
          publish_results: true

      - name: Upload the SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
