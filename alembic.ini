# Alembic is the only source of schema, in every environment including the test databases
# (ADR-0006). There is no `metadata.create_all()` anywhere in this repository, so a database
# that has not been migrated has no tables at all -- which is exactly the state a test starts
# from and exactly the state a deployment starts from.
[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os

# Deliberately empty. The URL comes from ACADEMY_DATABASE_URL at run time (env.py), because a
# connection string in a tracked file is a connection string someone eventually commits with a
# password in it.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
