line-length = 119
target-version = "py314"

# The rule set stays in step with multi-tenant-python's, because the domain is
# copied from it verbatim (ADR-0002). A rule the copied domain does not satisfy
# would force a choice between editing the domain and carrying a per-file-ignore
# for it, and both would undermine the point of the copy. A rule it *does*
# satisfy may be added -- C90 below came from the localenv-python scaffold and
# was verified against the copied tree before being selected.
#
# `TC` (flake8-type-checking) is the standing counter-example and must stay out:
# it moves annotation-only imports into `if TYPE_CHECKING:` blocks, but names
# here are subscripted in class bases (`Repository[Person, PersonId]`), which is
# a runtime expression that `from __future__ import annotations` does not defer.
# Deferring those imports is a NameError, and the rule reports 120 violations.
[lint]
select = [
    "E", "F", "W",  # pycodestyle + pyflakes
    "I",            # isort
    "N",            # pep8-naming
    "UP",           # pyupgrade
    "B",            # flake8-bugbear
    "C90",          # mccabe complexity -- honors [lint.mccabe] max-complexity below
    "S",            # flake8-bandit
    "SIM",          # flake8-simplify
    "RET",          # flake8-return
    "PIE",          # flake8-pie
    "YTT",          # flake8-2020
    "D",            # pydocstyle
]
ignore = [
    "D203",  # one-blank-line-before-class -- conflicts with D211
    "D213",  # multi-line-summary-second-line -- conflicts with D212
]

[lint.pydocstyle]
convention = "google"

[lint.mccabe]
max-complexity = 15

[lint.per-file-ignores]
# assert is the idiomatic way to write a test assertion; it's disallowed
# in application code because `python -O` strips asserts at runtime.
"tests/**" = ["S101", "D"]
# The e2e tests exist precisely to launch the real CLI and the real HTTP
# server as separate processes, so the "don't call subprocess" rules are
# inapplicable here by construction. Commands are built as argv lists from
# sys.executable -- never a shell string, never user input.
"tests/e2e/**" = ["S101", "D", "S603"]

[format]
quote-style = "single"
